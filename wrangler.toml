name = "groupnote"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "groupnote-db"
database_id = "REPLACE_WITH_DATABASE_ID"
migrations_dir = "migrations"
